name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # The unit tests cover pure-Python modules, so the heavy runtime
      # dependencies (Whisper, GTK, audio) are not needed here.
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest -q
