name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v ver="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## " ver { found=1; next }
            found && /^## / { exit }
            found { print }' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "hushtype $GITHUB_REF_NAME" --notes "$notes"
