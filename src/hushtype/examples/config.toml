# hushtype configuration. Every key is optional; delete what you don't change.
# Location: ~/.config/hushtype/config.toml

[model]
# Any faster-whisper model: tiny, base, small, medium, large-v3, large-v3-turbo,
# distil-large-v3 ... Bigger is more accurate but slower and needs more VRAM.
name = "large-v3-turbo"
# ISO 639-1 code ("en", "de", "es", "tr", ...) or "auto". Auto-detection can
# guess wrong on very short clips, so pin it if you always use one language.
language = "auto"
device = "auto"        # auto | cuda | cpu
beam_size = 5

[hotkey]
# Used when you are in the `input` group (evdev). Modifier-only combos work.
# Names: ctrl, shift, alt, super, or any key such as "space", "f9", "z".
hold = ["ctrl", "super"]
quit = ["ctrl", "super", "shift", "q"]
# Used through the desktop portal otherwise. A regular key is required here.
# After the first run you can rebind it in your desktop's shortcut settings.
portal_hold = "CTRL+LOGO+z"
portal_quit = "CTRL+SHIFT+LOGO+q"

[audio]
microphone = ""        # "" = system default; a name fragment or index from `hushtype mics`
min_duration = 0.4     # seconds; shorter recordings are ignored
beeps = true
beep_volume = 0.28
# Bluetooth headsets often swallow the first ~150 ms of a sound. If you miss
# the start beep, try 0.16 (recording itself still starts instantly).
beep_lead_silence = 0.0

[output]
paste = true             # false = copy to the clipboard only
restore_clipboard = true # put your previous clipboard back after pasting

[ui]
overlay = true  # animated pill at the bottom of the screen
tray = true     # system tray icon

[text]
# Tokens shared by the style sample and vocabulary (32-300). Higher fits more
# terms but leaves less room for long dictations.
prompt_token_budget = 224
# Relative to this directory.
vocabulary = "vocabulary.txt"
style = "style.txt"
replacements = "replacements.txt"

[tone]
# Per-app tone: shape the text for the app you dictate into. Works on KDE
# Plasma, sway, Hyprland and X11. Each kind of app gets a tone by name: the
# built-in tones are default, formal, casual, very_casual and email, and you
# can change them or add your own under [tones.NAME] (see below).
enabled = false
personal = "casual"   # WhatsApp, Telegram, Signal, Discord ...
work = "default"      # Slack, Teams, Zoom, Mattermost ...
email = "email"       # Thunderbird, Evolution, Gmail in a browser ...
other = "default"     # everything else

[apps]
# Your own rules, checked before the built-in lists: text found in the app id
# or window title (run `hushtype app` to see them). "other" opts an app out.
personal = []
work = []
email = []
other = []

# Tones. Only list what you change; anything left out keeps the built-in value.
# Every key, with what it accepts:
#
# [tones.email]
# case = "capitalize"          # unchanged | capitalize | lowercase (sentence starts;
#                              #   lowercase keeps vocabulary names, acronyms, "I")
# final_period = "add"         # unchanged | add | remove | remove_short
# short_sentences = 2          # remove_short: only messages up to this many sentences
# layout = "email"             # none | email: greeting and closing on their own
#                              #   lines, "new paragraph" starts a paragraph, later
#                              #   takes into the same window start a new paragraph
# signature = "Alex\nAcme"   # email layout: goes under the closing ("\n" = new line)
# greetings = ["howdy"]        # extra greetings, on top of hi, hello, dear, merhaba ...
# closings = ["cheers mate"]   # extra closings, on top of best regards, thanks, saygılarımla ...
# replacements = ["gonna => going to"]  # wrong => right, only in this tone
#
# A tone of your own:
# [tones.client_chat]
# case = "capitalize"
# final_period = "remove_short"
# replacements = ["yeah => yes"]
